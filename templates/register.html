{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h2 class="auth-title">{{ _t('register') }}</h2>
    <p class="auth-subtitle">{{ _t('sub_title') }}</p>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label class="form-label">{{ _t('full_name') }}</label>
            <input type="text" name="full_name" class="form-control" required autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label">{{ _t('username') }}</label>
            <input type="text" name="username" class="form-control" required autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label">{{ _t('email') }}</label>
            <input type="email" name="email" class="form-control" required autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label">{{ _t('role') }}</label>
            <select name="role" class="form-control" required>
                <option value="Researcher">{{ _t('role_researcher') }}</option>
                <option value="Viewer">{{ _t('role_viewer') }}</option>
                <!-- لاحظ أمنياً: لا يوجد خيار Admin هنا على الإطلاق لمنع تصعيد الصلاحيات -->
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">{{ _t('role') }}</label>
            <select name="role" class="form-control" required>
                <option value="User">{{ _t('role_user') }}</option>
                <option value="Researcher">{{ _t('role_researcher') }}</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">{{ _t('affiliation') }}</label>
            <input type="text" name="affiliation" class="form-control" placeholder="University / Institute / Independent">
        </div>

    <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{{ url_for('login') }}" style="color: var(--lavender-accent); font-size: 0.9rem; text-decoration: none;">
            {{ _t('have_account') }}
        </a>
    </div>
</div>
{% endblock %}
